name: Notebook check
# Executes notebooks/DGM_HMamba_demo.ipynb end to end on a CPU runner (smoke tests,
# data download, evaluation of the released s5_m42 model). Branch-only check.
on:
  push:
    branches: ["nbcheck/**"]
jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt nbconvert nbclient ipykernel
      - name: Execute the notebook
        run: |
          jupyter nbconvert --to notebook --execute notebooks/DGM_HMamba_demo.ipynb \
            --ExecutePreprocessor.timeout=5400 --output executed.ipynb
          python - <<'PY'
          import json
          nb = json.load(open("notebooks/executed.ipynb"))
          for c in nb["cells"]:
              if c["cell_type"] != "code":
                  continue
              for o in c.get("outputs", []):
                  if o.get("output_type") == "error":
                      raise SystemExit("cell error: " + o.get("ename", ""))
                  txt = "".join(o.get("text", "")) if isinstance(o.get("text"), (list, str)) else ""
                  for line in txt.splitlines():
                      if "OA" in line and ("recorded" in line or "fingerprint" in line):
                          print(line)
          print("notebook ran without errors")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-notebook
          path: notebooks/executed.ipynb
