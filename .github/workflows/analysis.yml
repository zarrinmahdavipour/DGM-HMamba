name: Dataset analysis

on:
  workflow_dispatch:
  push:
    branches: ["analysis/**"]

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download Indian Pines and Pavia University
        run: python scripts/prepare_data.py --data-root data --download indian_pines pavia_u
      - name: Analyse Pavia University
        run: python scripts/analyze_dataset.py --data-root data --target pavia_u --patch-size 7
      - name: Analyse Pavia University (9x9 patches)
        run: python scripts/analyze_dataset.py --data-root data --target pavia_u --patch-size 9
