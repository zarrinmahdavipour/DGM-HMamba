name: Build class-name embeddings (GloVe)

# Downloads the GloVe 6B vectors (Wikipedia 2014 + Gigaword 5, 300-d; Public
# Domain Dedication and License), keeps the vectors of the class-name tokens of
# the five scenes and commits class_embeddings/glove.6B.300d.json to the branch.
# Triggered manually or by pushing a branch named embeddings/<something>.
on:
  workflow_dispatch:
  push:
    branches: ["embeddings/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download GloVe 6B
        run: |
          for url in https://nlp.stanford.edu/data/glove.6B.zip \
                     https://downloads.cs.stanford.edu/nlp/data/glove.6B.zip \
                     https://huggingface.co/stanfordnlp/glove/resolve/main/glove.6B.zip; do
            echo "trying $url"
            if curl -fL --retry 3 --connect-timeout 30 -o glove.6B.zip "$url" && unzip -tq glove.6B.zip; then
              break
            fi
            rm -f glove.6B.zip
          done
          test -f glove.6B.zip
          unzip -o glove.6B.zip glove.6B.300d.txt
          sha256sum glove.6B.zip glove.6B.300d.txt
      - name: Build the class-name embedding file
        run: |
          python scripts/make_class_embeddings.py --glove glove.6B.300d.txt --name glove.6B.300d \
            --out class_embeddings/glove.6B.300d.json
      - name: Commit it to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add class_embeddings/glove.6B.300d.json
          git commit -m "Class-name embeddings from GloVe 6B (300-d), built by class-embeddings.yml" || echo "unchanged"
          git push
