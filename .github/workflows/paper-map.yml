name: Paper map figure data
# Branch-only: evaluates the released s5_m42 model and commits the predicted map
# of support draw 1 and the false-colour composite, for the manuscript figure.
on:
  push:
    branches: ["paperfigs/**"]
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: python scripts/prepare_data.py --data-root data --download indian_pines pavia_u
      - run: |
          curl -fsSL -o v.zip https://github.com/zarrinmahdavipour/DGM-HMamba/releases/download/verified-ip2pu-v1/verified-ip2pu-v1.zip
          unzip -q v.zip -d verified
          python scripts/demo_real.py --data-root data --weights verified/s5_m42/model_final.pt --output-dir paper_fig
      - run: |
          mkdir -p paper_fig_data
          cp paper_fig/pred_map_draw1.npy paper_fig/false_colour.npy paper_fig/split_coords.npz paper_fig/demo_summary.json paper_fig/split.json paper_fig_data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper_fig_data
          git commit -m "Map figure data for s5_m42 (draw 1)"
          git push
