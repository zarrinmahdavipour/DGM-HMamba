                      print(f"RESULT {k} transductive per-class acc:", [None if a is None else round(a * 100, 1) for a in t.get("per_class_acc", [])])
              if mm and mm.get("transductive"):
                  t = mm["transductive"]
                  r1 = lambda xs: [None if x is None else round(x * 100, 1) for x in xs]
                  print(f"RESULT map transductive ({t['config']}): OA {t['oa_mean']*100:.2f} +/- {t['oa_sd']*100:.2f}  "
