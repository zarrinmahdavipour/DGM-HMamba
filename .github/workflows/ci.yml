name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q
      - name: Synthetic demos
        run: |
          python scripts/demo_forward.py
          python scripts/demo_train.py
      - name: Real-data demo pipeline on synthetic scenes
        run: |
          python tests/make_synthetic_data.py data_synthetic
          python scripts/prepare_data.py --data-root data_synthetic
          python scripts/demo_real.py --data-root data_synthetic --output-dir runs/ci_demo \
            --patch-size 5 --stage1-iters 3 --stage2-steps 3 --eval-episodes 2 --device cpu
          python scripts/demo_real.py --data-root data_synthetic --output-dir runs/ci_demo_geo \
            --patch-size 5 --stage1-iters 3 --stage2-steps 4 --eval-episodes 2 --device cpu \
            --split block --block-size 10 --val-blocks 0.2 --min-counts 3,3,3 --norm train \
            --split-seed 1 --eval-seed 0 --n-way 3 --k-shot 1 --q-query 2 --train-query 2 \
            --val-episodes 2 --val-every 2 --select-on-val --map-repeats 2 --no-diffusion \
            --transductive --tr-grid "iters=1,3;scale=10;topk=0,5" --tr-val-draws 2
          python - <<'PY'
          import json
          s = json.load(open("runs/ci_demo_geo/demo_summary.json"))
          assert "transductive" in s["map_metrics"] and "transductive_selected" in s["episodic_metrics"]["3way_1shot"]
          assert s["history"]["transductive_validation"]["selected"]
          print("transductive results present; chosen on validation:", s["history"]["transductive_validation"]["selected"])
          PY
          python scripts/demo_real.py --data-root data_synthetic --output-dir runs/ci_eval \
            --weights runs/ci_demo_geo/model_final.pt
          python - <<'PY'
          import json, sys
          a = json.load(open("runs/ci_demo_geo/demo_summary.json")); b = json.load(open("runs/ci_eval/demo_summary.json"))
          for k in a["episodic_metrics"]:
              assert a["episodic_metrics"][k]["oa_mean"] == b["episodic_metrics"][k]["oa_mean"], k
          assert a["map_metrics"]["oa_mean"] == b["map_metrics"]["oa_mean"]
          print("--weights reproduces the saved run's test results exactly")
          sys.argv = ["demo_real.py", "--preset", "verified", "--stage2-steps", "7"]
          sys.path.insert(0, "scripts")
          import demo_real
          p = demo_real.parse_args()
          assert p.stage1_iters == 800 and p.stage2_steps == 7 and p.no_diffusion and p.split == "block"
          assert p.split_seed == 5 and p.seed == 42 and p.norm == "train" and p.select_on_val
          print("--preset verified parsed")
          PY
          python scripts/demo_real.py --data-root data_synthetic --output-dir runs/ci_ablation \
            --patch-size 5 --stage1-iters 2 --stage2-steps 2 --eval-episodes 2 --device cpu \
            --split block --split-file runs/ci_demo_geo/split.json --norm train --n-way 3 --k-shot 1 \
            --q-query 2 --train-query 2 --val-episodes 2 --map-repeats 2 --no-diffusion \
            --encoder cnn --static-prototypes --lambda-adv 0 --lambda-diff 0
          python scripts/demo_real.py --data-root data_synthetic --output-dir runs/ci_demo_geo2 \
            --patch-size 5 --stage1-iters 2 --stage2-steps 2 --eval-episodes 2 --device cpu \
            --split block --split-file runs/ci_demo_geo/split.json --norm train --n-way 3 --k-shot 1 \
            --q-query 2 --train-query 2 --val-episodes 2 --map-repeats 2 --no-diffusion
          python - <<'PY'
          import json
          a = json.load(open("runs/ci_demo_geo/split.json"))["split_info"]
          b = json.load(open("runs/ci_demo_geo2/split.json"))["split_info"]
          assert a["index_fingerprint"] == b["index_fingerprint"], (a["index_fingerprint"], b["index_fingerprint"])
          assert a["windows_disjoint"] and a["leakage"]["patches_share_pixels"] == 0
          print("geographic split reproduced from split.json:", a["index_fingerprint"])
          PY
          # a run split into two jobs (--stop-after / --resume) must equal the uninterrupted run
          COMMON="--data-root data_synthetic --patch-size 5 --stage1-iters 3 --stage2-steps 8 --eval-episodes 3
            --device cpu --split block --block-size 10 --val-blocks 0.2 --min-counts 3,3,3 --norm train
            --n-way 3 --k-shot 1 --q-query 2 --train-query 2 --val-episodes 2 --val-every 2 --select-on-val
            --map-repeats 2 --augment --ema 0.9 --schedule cosine --warmup-frac 0.25"
          python scripts/demo_real.py $COMMON --output-dir runs/ci_full
          python scripts/demo_real.py $COMMON --output-dir runs/ci_part --stop-after 5
          python scripts/demo_real.py $COMMON --output-dir runs/ci_part --resume runs/ci_part/resume.pt
          # three parts: stop, resume and stop again, resume
          python scripts/demo_real.py $COMMON --output-dir runs/ci_part3 --stop-after 3
          python scripts/demo_real.py $COMMON --output-dir runs/ci_part3 --resume runs/ci_part3/resume.pt --stop-after 6
          python scripts/demo_real.py $COMMON --output-dir runs/ci_part3 --resume runs/ci_part3/resume.pt
          python - <<'PY'
          import json
          a = json.load(open("runs/ci_full/demo_summary.json"))
          for part in ("runs/ci_part", "runs/ci_part3"):
              b = json.load(open(part + "/demo_summary.json"))
              for k in ("episodic_metrics", "map_metrics"):
                  assert json.dumps(a[k], sort_keys=True) == json.dumps(b[k], sort_keys=True), (part, k)
              assert a["history"]["validation"] == b["history"]["validation"], part
              assert a["history"]["selected_episode"] == b["history"]["selected_episode"], part
          print("stop/resume reproduces the uninterrupted run exactly")
          PY
          python scripts/train.py --data-root data_synthetic --output-dir runs/ci_train \
            --stage1-epochs 1 --stage2-steps 2 --batch-size 16 --eval-every 1 \
            --eval-episodes 2 --val-fraction 0.2 --n-way 3 --k-shot 1 --q-query 2 \
            --preset tiny --device cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-demo-outputs
          path: runs/
