name: Experiment (real data, CPU)

# Runs the real-data demo (Indian Pines -> Pavia University) on a CPU runner.
# Triggered manually or by pushing a branch named exp/<something>.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "extra arguments for scripts/demo_real.py"
        required: false
        default: ""
  push:
    branches: ["exp/**"]

jobs:
  demo-real:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download Indian Pines and Pavia University
        run: python scripts/prepare_data.py --data-root data --download indian_pines pavia_u
      - name: Real-data demo
        run: |
          EXTRA="$(cat exp_args.txt 2>/dev/null || true)"
          echo "extra args: $EXTRA ${{ github.event.inputs.args }}"
          python scripts/demo_real.py --data-root data --output-dir runs/exp --device cpu $EXTRA ${{ github.event.inputs.args }}
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p = "runs/exp/demo_summary.json"
          if os.path.exists(p):
              s = json.load(open(p))
              for k, m in s["episodic_metrics"].items():
                  print(f"RESULT {k}: OA {m['oa_mean']*100:.2f} +/- {m['oa_std']*100:.2f}  AA {m['aa']*100:.2f}  kappa {m['kappa']:.4f}")
              if s["map_metrics"]:
                  mm = s["map_metrics"]
                  print(f"RESULT map: OA {mm['oa']*100:.2f}  AA {mm['aa']*100:.2f}  kappa {mm['kappa']:.4f}")
              h = s["history"]
              print("RESULT validation", {k: round(v * 100, 2) for k, v in h.get("validation", {}).items()})
              print("RESULT train acc (last 10% of episodes):", round(h.get("train_acc_last10pct", 0) * 100, 2),
                    "| selected episode:", h.get("selected_episode"))
              print("RESULT timings", {k: round(v) for k, v in s["timings_s"].items()})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-outputs
          path: runs/exp/
