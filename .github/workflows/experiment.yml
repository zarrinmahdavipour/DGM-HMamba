name: Experiment (real data, CPU)

# Runs the real-data demo (Indian Pines -> Pavia University) on a CPU runner.
# Triggered manually or by pushing a branch named exp/<something>.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "extra arguments for scripts/demo_real.py"
        required: false
        default: ""
  push:
    branches: ["exp/**"]

jobs:
  demo-real:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Skip code branches without exp_args.txt
        run: |
          if [ ! -f exp_args.txt ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "no exp_args.txt on this branch: nothing to run"; echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and dependencies
        if: env.SKIP != '1'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download Indian Pines and Pavia University
        if: env.SKIP != '1'
        run: python scripts/prepare_data.py --data-root data --download indian_pines pavia_u
      - name: Real-data demo
        if: env.SKIP != '1'
        run: |
          EXTRA="$(cat exp_args.txt 2>/dev/null || true)"
          echo "extra args: $EXTRA ${{ github.event.inputs.args }}"
          python scripts/demo_real.py --data-root data --output-dir runs/exp --device cpu $EXTRA ${{ github.event.inputs.args }}
      - name: Summary
        if: always() && env.SKIP != '1'
        run: |
          python - <<'PY'
          import json, os
          p = "runs/exp/demo_summary.json"
          if os.path.exists(p):
              s = json.load(open(p))
              for k, m in s["episodic_metrics"].items():
                  print(f"RESULT {k}: OA {m['oa_mean']*100:.2f} +/- {m['oa_std']*100:.2f}  AA {m['aa']*100:.2f}  kappa {m['kappa']:.4f}")
                  print(f"RESULT {k} per-class acc:", [None if a is None else round(a * 100, 1) for a in m.get("per_class_acc", [])])
              mm = s.get("map_metrics")
              if mm:
                  print(f"RESULT map ({mm['repeats']} draws): OA {mm['oa_mean']*100:.2f} +/- {mm['oa_sd']*100:.2f}  "
                        f"AA {mm['aa_mean']*100:.2f} +/- {mm['aa_sd']*100:.2f}  kappa {mm['kappa_mean']:.4f}")
                  r1 = lambda xs: [None if x is None else round(x * 100, 1) for x in xs]
                  print("RESULT map recall   :", r1(mm["recall_mean"]))
                  print("RESULT map precision:", r1(mm["pooled_precision"]))
                  print("RESULT map F1       :", r1(mm["pooled_f1"]))
                  print("RESULT map confusion:", mm["pooled_confusion"])
              h = s["history"]
              print("RESULT validation", {k: round(v * 100, 2) for k, v in h.get("validation", {}).items()})
              print("RESULT train acc (last 10% of episodes):", round(h.get("train_acc_last10pct", 0) * 100, 2),
                    "| selected episode:", h.get("selected_episode"),
                    "| skipped non-finite updates:", h.get("skipped_updates"))
              si = s.get("split_info", {})
              print("RESULT seeds", s.get("seeds"))
              hide = ("leakage", "leakage_train_val", "block_grid", "block_grid_labelled", "class_counts", "pool_class_counts")
              print("RESULT split", {k: v for k, v in si.items() if k not in hide})
              print("RESULT split leakage train-test", si.get("leakage"), "| train-val", si.get("leakage_train_val"))
              if si.get("block_grid"):
                  print("RESULT block grid (0 train, 1 val, 2 test)", " ".join(si["block_grid"]))
              print("RESULT pool class counts", si.get("pool_class_counts"))
              if mm and mm.get("support_separated"):
                  sp = mm["support_separated"]
                  print(f"RESULT map, queries sharing no pixels with supports: OA {sp['oa_mean']*100:.2f} +/- {sp['oa_sd']*100:.2f}  "
                        f"AA {sp['aa_mean']*100:.2f} +/- {sp['aa_sd']*100:.2f}  excluded/draw {sp['excluded_queries_mean']:.0f}  "
                        f"recall {[None if x is None else round(x * 100, 1) for x in sp['recall_mean']]}")
                  print("RESULT map queries per class per draw:", mm.get("query_support_per_draw"))
              print("RESULT params", s["trainable_parameters"], "| timings", {k: round(v, 2) for k, v in s["timings_s"].items()})
          PY
      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != '1'
        with:
          name: experiment-outputs
          path: runs/exp/
